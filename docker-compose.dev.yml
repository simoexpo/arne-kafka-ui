services:
  kafka:
    image: apache/kafka:latest
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9091,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://host.docker.internal:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka2:
    image: apache/kafka:latest
    ports: ["9093:9093"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9091,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:19092,EXTERNAL://host.docker.internal:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka2:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    depends_on: [kafka]
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:19092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  demo-producer:
    image: apache/kafka:latest
    depends_on: [kafka]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        sleep 10
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic demo-orders --partitions 3 --config cleanup.policy=delete
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic demo-users --partitions 3 --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic demo-audit --partitions 2 --config cleanup.policy=compact,delete
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic sr-json --partitions 1 --config cleanup.policy=delete
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic sr-avro --partitions 2 --config cleanup.policy=delete
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic sr-proto --partitions 2 --config cleanup.policy=delete
        i=0
        while true; do
          i=$$((i+1))
          echo "order-$$i:{\"order_id\":$$i,\"amount\":$$((i*3)).50}" | \
            /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server kafka:19092 --topic demo-orders \
              --property parse.key=true --property key.separator=: >/dev/null
          u=$$(( (i % 5) + 1 ))
          echo "user-$$u:{\"user_id\":$$u,\"seq\":$$i}" | \
            /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server kafka:19092 --topic demo-users \
              --property parse.key=true --property key.separator=: >/dev/null
          a=$$((i % 10))
          echo "audit-$$a:{\"audit_id\":$$a,\"seq\":$$i}" | \
            /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server kafka:19092 --topic demo-audit \
              --property parse.key=true --property key.separator=: >/dev/null
          sleep 2
        done

  demo-producer2:
    image: apache/kafka:latest
    depends_on: [kafka2]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        sleep 10
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka2:19092 --create --if-not-exists --topic demo-orders --partitions 3 --config cleanup.policy=delete
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka2:19092 --create --if-not-exists --topic demo-users --partitions 3 --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka2:19092 --create --if-not-exists --topic demo-audit --partitions 2 --config cleanup.policy=compact,delete
        i=0
        while true; do
          i=$$((i+1))
          echo "order-$$i:{\"order_id\":$$i,\"amount\":$$((i*3)).50}" | \
            /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server kafka2:19092 --topic demo-orders \
              --property parse.key=true --property key.separator=: >/dev/null
          u=$$(( (i % 5) + 1 ))
          echo "user-$$u:{\"user_id\":$$u,\"seq\":$$i}" | \
            /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server kafka2:19092 --topic demo-users \
              --property parse.key=true --property key.separator=: >/dev/null
          a=$$((i % 10))
          echo "audit-$$a:{\"audit_id\":$$a,\"seq\":$$i}" | \
            /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server kafka2:19092 --topic demo-audit \
              --property parse.key=true --property key.separator=: >/dev/null
          sleep 2
        done

  demo-producer-sr:
    image: confluentinc/cp-schema-registry:7.7.1
    depends_on: [kafka, schema-registry]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        attempt=0
        while ! curl -sf http://schema-registry:8081/subjects >/dev/null 2>&1; do
          attempt=$$((attempt+1))
          if [ $$attempt -ge 30 ]; then
            echo "schema-registry not reachable after $$attempt attempts, proceeding anyway"
            break
          fi
          sleep 2
        done
        i=0
        while true; do
          i=$$((i+1))
          { for n in 1 2 3 4; do echo "{\"id\":$$((i*10+n)),\"item\":\"widget-$$((i*10+n))\"}"; done; } | \
            kafka-avro-console-producer --bootstrap-server kafka:19092 --topic sr-avro \
              --property schema.registry.url=http://schema-registry:8081 \
              --property value.schema='{"type":"record","name":"Order","fields":[{"name":"id","type":"long"},{"name":"item","type":"string"}]}'
          { for n in 1 2 3 4; do echo "{\"id\":$$((i*10+n)),\"name\":\"event-$$((i*10+n))\"}"; done; } | \
            kafka-protobuf-console-producer --bootstrap-server kafka:19092 --topic sr-proto \
              --property schema.registry.url=http://schema-registry:8081 \
              --property value.schema='syntax = "proto3"; message Event { int64 id = 1; string name = 2; }'
          { for n in 1 2 3 4; do echo "{\"id\":$$((i*10+n)),\"status\":\"open\"}"; done; } | \
            kafka-json-schema-console-producer --bootstrap-server kafka:19092 --topic sr-json \
              --property schema.registry.url=http://schema-registry:8081 \
              --property value.schema='{"type":"object","properties":{"id":{"type":"integer"},"status":{"type":"string"}}}'
          sleep 15
        done

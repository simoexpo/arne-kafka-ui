name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The image name is the only place the registry account appears.
  IMAGE: simoexpo/arne

jobs:
  backend:
    name: backend (clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-rdkafka compiles librdkafka from source; these are the same
      # packages the Dockerfile installs.
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ make perl pkg-config libcurl4-openssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Clippy (warnings are errors)
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings

      # The integration suite starts a real Kafka broker per run via
      # testcontainers, using the Docker daemon the runner already provides.
      # It is the slow half of CI and the reason the cache above matters.
      - name: Tests (unit + integration against a real broker)
        working-directory: backend
        run: cargo test --all-targets

  frontend:
    name: frontend (lint + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      - run: npx vitest run
        working-directory: frontend

      # `tsc -b` runs here — the real type gate, which vitest does not enforce.
      - run: npm run build
        working-directory: frontend

  image:
    name: publish image
    # Nothing reaches Docker Hub unless both suites are green.
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # main -> :latest and :main-<sha>; a v1.2.3 tag -> :1.2.3, :1.2 and :latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # linux/amd64 only: the image builds librdkafka from source, and an
      # arm64 build under QEMU emulation takes the better part of an hour.
      # Add a native arm64 runner before adding the platform.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

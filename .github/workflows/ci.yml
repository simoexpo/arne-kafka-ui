name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The only place the registry account appears.
  IMAGE: simoexpo/arne-kafka-ui

jobs:
  backend:
    name: backend (fmt + clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-rdkafka compiles librdkafka from source; these are the same
      # packages the Dockerfile installs.
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ make perl pkg-config libcurl4-openssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo and backend/target, which is where the compiled
      # librdkafka lives — so the ~13 minute C build happens on the first run
      # and then only when Cargo.lock or the toolchain changes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Formatting
        working-directory: backend
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings

      # The integration suite starts a real Kafka broker per run via
      # testcontainers, using the Docker daemon the runner already provides.
      - name: Tests (unit + integration against a real broker)
        working-directory: backend
        run: cargo test --all-targets

  frontend:
    name: frontend (lint + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      - run: npx vitest run
        working-directory: frontend

      # `tsc -b` runs here — the real type gate, which vitest does not enforce.
      - run: npm run build
        working-directory: frontend

  image:
    name: image (${{ matrix.platform }})
    # Nothing reaches Docker Hub unless both suites are green.
    needs: [backend, frontend]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # Native arm64 runner: this image compiles librdkafka from source,
          # and the same build under QEMU emulation takes the better part of
          # an hour. Free for public repositories.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Each architecture is pushed by digest only; the `merge` job below is
      # what attaches the human-readable tags, as one multi-arch manifest.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Separate scopes: one architecture's layers must not evict the other's.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/$(echo '${{ matrix.platform }}' | tr / -)"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    name: publish multi-arch tags
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # main -> :latest and :main-<sha>; a v1.2.3 tag -> :1.2.3, :1.2 and :latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the manifest list
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@%s ' $(cat /tmp/digests/*))

      - name: Inspect what was published
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

[package]
name = "arne"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
apache-avro = "0.22.0"
axum = "0.8.9"
base64 = "0.23.1"
futures-util = "0.3.33"
mime_guess = "2.0.5"
protobuf = "3.7.2"
protobuf-json-mapping = "3.7.2"
protobuf-parse = "3.7.2"
rdkafka = { version = "0.39.0", features = ["cmake-build", "ssl-vendored"] }
# The raw C bindings rdkafka already compiles: a handful of librdkafka admin
# calls (DescribeCluster, ListOffsets, ListConsumerGroupOffsets) exist in the
# C library but were never wrapped by the safe layer — see cluster::ffi.
rdkafka-sys = { version = "4.10", features = ["cmake-build", "ssl-vendored"] }
reqwest = { version = "0.13.4", features = ["json"] }
rust-embed = "8.12.0"
# "rc" so a cached payload can be served straight out of an Arc: a cache HIT
# must not deep-copy a 10k-element list on every request.
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
futures-util = "0.3.33"
http-body-util = "0.1.4"
libc = "0.2.189"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
testcontainers = { version = "0.27", features = ["reusable-containers"] }
testcontainers-modules = { version = "0.15.0", features = ["kafka"] }
tower = { version = "0.5.3", features = ["util"] }
urlencoding = "2.1.3"
